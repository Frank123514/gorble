# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

#read more on this at https://github.com/neoforged/NeoGradle/blob/NG_7.0/README.md#apply-parchment-mappings
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
neogradle.subsystems.parchment.minecraftVersion=1.21.11
# TODO(port-1.21.11): As of this port, ParchmentMC has NOT published mappings past
# parchment-1.21.8 (confirmed via https://mvnrepository.com/artifact/org.parchmentmc.data
# and https://maven.blamejared.com listings on 2026-08-09). NeoForge 21.11's release notes
# mention Mojang is moving toward unobfuscated MC, which may be why Parchment hasn't caught
# up for 1.21.9/.10/.11 yet. Left pointed at 1.21.8 mappings (still works via NeoGradle, just
# means method/param names for anything changed since 1.21.8 will show as obfuscated-ish
# Mojmap names instead of Parchment's friendly names). Check
# https://maven.parchmentmc.org/org/parchmentmc/data/ for a parchment-1.21.11 or
# parchment-1.21.10 release and bump both lines below if one exists by the time you build.
neogradle.subsystems.parchment.mappingsVersion=2025.12.20
# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.11
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.11]
# The Neo version must agree with the Minecraft version to get a valid artifact
# Latest 21.11.x release confirmed via
# https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml (2026-08-09)
neo_version=21.11.45
# The JEI version — https://maven.blamejared.com/mezz/jei/
# Latest jei-1.21.11-neoforge build confirmed via
# https://maven.blamejared.com/mezz/jei/jei-1.21.11-neoforge/ (2026-08-09)
jei_version=27.22.0.64
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=got
# The human-readable display name for the mod.
mod_name=Game of Thrones
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=1.0.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=net.got
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Francis3637,
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=A Game of Thrones mod for Minecraft.